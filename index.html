<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./brand/kalb-k-plate.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c0b0a" />
    <!-- Job numbers, addresses and PM names are on every pin. Nothing here
         should ever turn up in a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Installable app: Chrome/Edge "Install this site as an app" gives a
         real desktop icon in its own window, no browser chrome. -->
    <!-- use-credentials sends the access cookie with the manifest request.
         Without it the manifest fetch is anonymous, the gate 404s it, and
         the installed desktop app loses its name and icon. -->
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="./brand/app/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Project Atlas" />
    <title>Kalb Construction — Project Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
